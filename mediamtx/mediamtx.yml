# mediamtx.yml — MediaMTX v1.x — Highway project
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# ── RTSP — Jetson buraya push eder ───────────────────────────────────────────
rtsp: yes
rtspAddress: :8554

# ── WebRTC / WHEP — browser buradan çeker ────────────────────────────────────
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts:
  - 100.84.29.29   # RPi5 Tailscale IP
  - 192.168.0.17   # RPi5 LAN IP

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  cam1:
    source: publisher

  highway:
    # Jetson rtspclientsink ile TCP üzerinden push eder
    source: publisher
