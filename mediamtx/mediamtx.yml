# mediamtx.yml — MediaMTX v1.x — Highway project
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# ── RTSP — Jetson buraya push eder ───────────────────────────────────────────
rtsp: yes
rtspAddress: :8554

# ── WebRTC / WHEP — browser buradan çeker ────────────────────────────────────
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts:
  - 100.84.29.29   # RPi5 Tailscale IP — sabit, LAN IP ekleme

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  cam1:
    source: publisher

  highway:
    # mediamtx Jetson'ın RTSP server'ından pull eder
    # Jetson: udpsink host=127.0.0.1 → GstRtspServer → rtsp://jetson:8554/stream
    # Browser: /whep/highway/whep  →  nginx  →  mediamtx:8889/highway/whep
    source: rtsp://100.74.245.10:8554/stream
    sourceOnDemand: no
