# mediamtx.yml — MediaMTX v1.x — Highway project
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# ── RTSP — Jetson buraya push eder ───────────────────────────────────────────
rtsp: yes
rtspAddress: :8554

# ── WebRTC / WHEP — browser buradan çeker ────────────────────────────────────
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts:
  - 100.84.29.29   # RPi5 Tailscale IP — sabit, LAN IP ekleme

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  cam1:
    source: publisher
    # TODO: production'da publishUser/publishPass ekle

  highway:
    source: publisher
    # Jetson RTSP publish: rtsp://<server>:8554/highway
    # Browser WHEP consume: http://<server>:8889/highway/whep (via nginx /whep/highway/whep)
