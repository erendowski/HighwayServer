# mediamtx.yml — MediaMTX v1.x — Highway project
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# ── RTSP — Jetson buraya push eder ───────────────────────────────────────────
rtsp: yes
rtspAddress: :8554

# ── WebRTC / WHEP — browser buradan çeker ────────────────────────────────────
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts:
  - 100.84.29.29   # RPi5 Tailscale IP
  - 192.168.0.17   # RPi5 LAN IP

# ── HLS/MJPEG — port 8888 üzerinden ─────────────────────────────────────────
# MJPEG endpoint: http://<host>:8888/<path>/mjpeg
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  cam1:
    source: publisher

  highway:
    # MediaMTX Jetson'ın RTSP stream'ini çeker → MJPEG olarak sunar
    source: rtsp://100.74.245.10:8554/stream
    sourceProtocol: tcp
