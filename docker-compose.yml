services:

  highwayserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: highwayserver:latest
    container_name: highwayserver
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Mqtt__Host=emqx
      - Mqtt__Port=1883
      - Mqtt__ClientId=HighwayServer
      - InfluxDb__Url=http://influxdb:8086
      - InfluxDb__Token=${INFLUXDB_TOKEN}
      - InfluxDb__Org=${INFLUXDB_ORG}
      - InfluxDb__Bucket=${INFLUXDB_BUCKET}
      - Cors__Origins__0=${CORS_ORIGIN_0}
      - Cors__Origins__1=${CORS_ORIGIN_1}
    volumes:
      - ./logs:/app/logs
    networks:
      - highway-net
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: highway-nginx
    restart: unless-stopped
    depends_on:
      highwayserver:
        condition: service_started
      mediamtx:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - highway-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  emqx:
    image: emqx/emqx:5.8.2
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "18083:18083"
    environment:
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USER}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASS}
      - EMQX_ALLOW_ANONYMOUS=true
      # Authentication chain yok — tüm clientlar (credentials gönderse de göndermese de) bağlanır
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - highway-net
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${DOCKER_INFLUXDB_INIT_MODE}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - highway-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    environment:
      - RPI_TAILSCALE_IP=${RPI_TAILSCALE_IP}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"        # RTSP — Jetson buraya push eder
      - "8889:8889"        # WebRTC WHEP HTTP
      - "8189:8189/udp"    # WebRTC ICE UDP
    networks:
      - highway-net
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: highway-cloudflared
    restart: unless-stopped
    command: --no-autoupdate tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - highway-net
    depends_on:
      nginx:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  highway-net:
    driver: bridge

volumes:
  emqx-data:
  emqx-log:
  influxdb-data:
  influxdb-config:
