services:
  highwayserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: highwayserver:latest
    container_name: highwayserver
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Mqtt__Host: emqx
      Mqtt__Port: 1883
      Mqtt__ClientId: HighwayServer
      InfluxDb__Url: http://influxdb:8086
      InfluxDb__Token: ${INFLUXDB_TOKEN:-highway-token}
      InfluxDb__Org: ${INFLUXDB_ORG:-highway}
      InfluxDb__Bucket: ${INFLUXDB_BUCKET:-highway}
    depends_on:
      - emqx
      - influxdb
    networks:
      - highway-net

  nginx:
    image: nginx:1.27-alpine
    container_name: highway-nginx
    restart: unless-stopped
    depends_on:
      - highwayserver
      - mediamtx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - highway-net

  emqx:
    image: emqx/emqx:5.8.2
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "18083:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - highway-net

  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-highway-admin-password}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-highway-token}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-highway}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-highway}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - highway-net

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
    networks:
      - highway-net

networks:
  highway-net:
    driver: bridge

volumes:
  emqx-data:
  emqx-log:
  influxdb-data:
  influxdb-config:
